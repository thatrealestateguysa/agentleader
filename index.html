<!doctype html> <html lang="en"> <head> <meta charset="utf-8"/> <meta name="viewport" content="width=device-width,initial-scale=1"/> <title>KWE Agent ScoreBoard</title> <style> :root { --bg-primary: #111216; --bg-secondary: #1a1b20; --bg-tertiary: #0b0b0c; --border-color: #2f3138; --text-primary: #f0f0f0; --text-secondary: #a3a3ad; --brand-color: #C70000; --brand-hover: #a10000; --success-color: #28a745; --success-bg: #0f2a18; --success-border: #1e5b3a; } body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg-tertiary); color: var(--text-primary); } .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; } .header { position: sticky; top: 0; z-index: 10; background: rgba(11, 11, 12, 0.8); backdrop-filter: saturate(1.2) blur(8px); border-bottom: 1px solid var(--border-color); } .brand { display: flex; gap: 12px; align-items: center; } .kw-logo { width: 44px; height: 44px; border-radius: 12px; background: var(--brand-color); display: grid; place-items: center; font-weight: 800; font-size: 1.1em; } .row { display: grid; gap: 24px; grid-template-columns: 1fr 1.5fr; } @media (max-width: 900px) { .row { grid-template-columns: 1fr; } } .card { border: 1px solid var(--border-color); background: var(--bg-primary); border-radius: 16px; overflow: hidden; } .card-head { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 1.1em; } .card-body { padding: 20px; } input, select, button { font: inherit; color: inherit; } .form-grid { display: grid; gap: 16px; } .form-group label { display: block; font-size: 0.8em; color: var(--text-secondary); margin-bottom: 6px; } .input-field { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; width: 100%; box-sizing: border-box; } .input-field:focus { outline: 2px solid var(--brand-color); border-color: transparent; } .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } button { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 16px; cursor: pointer; transition: background 0.2s; } button:hover { background: var(--border-color); } button.primary { background: var(--brand-color); border-color: transparent; font-weight: 600; } button.primary:hover { background: var(--brand-hover); } button:disabled { opacity: 0.6; cursor: not-allowed; } .pill { padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 500; } .pill.ok { background: var(--success-bg); color: #c6f6d5; } .pill.bad { background: #441c1c; color: #f8d7da; } .tabs { display: flex; gap: 8px; flex-wrap: wrap; } .tabs button.active { background: var(--brand-color); border-color: transparent; } table { width: 100%; border-collapse: collapse; } thead th { position: sticky; top: 0; background: var(--bg-primary); padding: 12px 10px; font-size: 0.8em; text-align: left; color: var(--text-secondary); } th.num, td.num { text-align: right; } tbody tr:hover { background: var(--bg-secondary); } td { padding: 12px 10px; border-top: 1px solid var(--border-color); } .loader, .loader:after { border-radius: 50%; width: 1.5em; height: 1.5em; } .loader { font-size: 10px; position: relative; text-indent: -9999em; border: 0.2em solid var(--border-color); border-left-color: var(--text-primary); transform: translateZ(0); animation: load8 1.1s infinite linear; } @keyframes load8 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } </style> </head> <body> <div class="header"> <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;padding:12px 24px;"> <div class="brand"> <div class="kw-logo">KW</div> <div> <div style="font-weight:600">KWE Agent ScoreBoard</div> <div style="font-size:12px;color:var(--text-secondary)">Lead Generation Dashboard</div> </div> </div> <div id="connectionStatus" class="pill bad">Connecting...</div> </div> </div> <div class="wrap"> <div class="row"> <section class="card"> <div class="card-head">Submit Daily Activity</div> <div class="card-body"> <form id="entryForm"> <div class="form-grid"> <div class="form-group"> <label for="date">Date</label> <input id="date" type="date" class="input-field" /> </div> <div class="form-group"> <label for="agentInput">Agent Name (Select or Type New)</label> <input id="agentInput" list="agentDatalist" class="input-field" placeholder="Select or type agent name..." required/> <datalist id="agentDatalist"></datalist> </div> <div class="grid-2"> <div class="form-group"><label>Dials</label><input id="dials" type="number" min="0" value="0" class="input-field"/></div> <div class="form-group"><label>Calls Answered</label><input id="answered" type="number" min="0" value="0" class="input-field"/></div> <div class="form-group"><label>Whatsapps</label><input id="whatsapps" type="number" min="0" value="0" class="input-field"/></div> <div class="form-group"><label>NO’s</label><input id="nos" type="number" min="0" value="0" class="input-field"/></div> <div class="form-group"><label>Appointments</label><input id="appointments" type="number" min="0" value="0" class="input-field"/></div> <div class="form-group"><label>Listings</label><input id="listings" type="number" min="0" value="0" class="input-field"/></div> </div> <div style="display:flex;gap:12px;margin-top:8px;"> <button class="primary" type="submit" id="submitBtn">Save Entry</button> <button type="button" id="clearBtn">Clear Numbers</button> </div> </div> </form> </div> </section> <section class="card"> <div class="card-head" style="display:flex;justify-content:space-between;align-items:center;"> <span>Leaderboard</span> <div class="tabs"> <button data-period="daily" class="active">Today</button> <button data-period="weekly">This Week</button> <button data-period="monthly">This Month</button> <button id="refreshBtn" title="Refresh">🔄</button> </div> </div> <div class="card-body" style="padding:0;"> <div style="max-height:550px;overflow:auto;"> <table> <thead> <tr> <th>Agent</th> <th class="num">Dials</th> <th class="num">Answered</th> <th class="num">Whatsapps</th> <th class="num">NO’s</th> <th class="num">Appointments</th> <th class="num">Listings</th> </tr> </thead> <tbody id="leaderboardBody"> </tbody> </table> </div> </div> </section> </div> </div> <script> // ================================================================= // CONFIGURATION - Your details are now built-in. // ================================================================= const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwyiazfLj2VBAA9abMiApEVf_kg9Rt2lvyN0RumoD_1JJzWtq-tWeCzNqgglv9PXRtX/exec"; const API_TOKEN = "Yzc0ZTZkYjctMjJmNi00MzI2LWFjMjMtZDk3MjI0ZDAyZTA5MTJjYmU5NTYtMTM4Mi00NjVkLTk4ZDAtNWRlYmM3YTVmZGQy"; // ================================================================= // UI ELEMENT REFERENCES // ================================================================= const connStatusEl = document.getElementById('connectionStatus'); const dateEl = document.getElementById('date'); const agentInputEl = document.getElementById('agentInput'); const agentDatalistEl = document.getElementById('agentDatalist'); const formEl = document.getElementById('entryForm'); const submitBtn = document.getElementById('submitBtn'); const clearBtn = document.getElementById('clearBtn'); const leaderboardBody = document.getElementById('leaderboardBody'); const tabs = document.querySelectorAll('.tabs button[data-period]'); const refreshBtn = document.getElementById('refreshBtn'); const numberFields = ["dials","answered","whatsapps","nos","appointments","listings"]; // ================================================================= // STATE // ================================================================= let currentPeriod = 'daily'; let knownAgents = []; // ================================================================= // HELPER & UTILITY FUNCTIONS // ================================================================= /** Gets today's date in YYYY-MM-DD format for the date input */ function getTodayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); } /** Escapes HTML to prevent injection attacks */ function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); } /** Displays a loading state in the leaderboard */ function showLoader() { leaderboardBody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;"><div class="loader" style="margin:auto;"></div></td></tr>`; } // ================================================================= // API COMMUNICATION // ================================================================= /** Generic function to handle API calls and errors */ async function apiCall(method, params = {}) { try { let res; if (method === 'GET') { const qp = new URLSearchParams({ ...params, token: API_TOKEN }); res = await fetch(`${BACKEND_URL}?${qp.toString()}`); } else { // POST const payload = JSON.stringify({ ...params, token: API_TOKEN }); res = await fetch(BACKEND_URL, { method: "POST", body: new URLSearchParams({ payload }) }); } const data = await res.json(); if (!res.ok || data.error) throw new Error(data.error || `HTTP error! status: ${res.status}`); return data; } catch (error) { console.error('API Call Failed:', error); alert(`An error occurred: ${error.message}`); throw error; } } // ================================================================= // CORE LOGIC // ================================================================= /** Checks connection to the backend */ async function pingBackend() { try { await apiCall('GET', { action: "ping" }); connStatusEl.textContent = "Connected"; connStatusEl.className = "pill ok"; } catch (e) { connStatusEl.textContent = "Offline"; connStatusEl.className = "pill bad"; } } /** Fetches the list of agents and populates the datalist */ async function loadAgents() { try { const data = await apiCall('GET', { action: "agents" }); knownAgents = Array.isArray(data.agents) ? data.agents : []; agentDatalistEl.innerHTML = knownAgents.map(a => `<option value="${escapeHtml(a)}"></option>`).join(''); } catch (e) { // Silently fail, user can still type a name. } } /** Renders the leaderboard table with data */ function renderLeaderboard(totals) { if (!totals || totals.length === 0) { leaderboardBody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-secondary);padding:20px;">No data for this period.</td></tr>'; return; } leaderboardBody.innerHTML = totals.map(r => ` <tr> <td>${escapeHtml(r.agent || '(no name)')}</td> <td class="num">${r.dials || 0}</td> <td class="num">${r.answered || 0}</td> <td class="num">${r.whatsapps || 0}</td> <td class="num">${r.nos || 0}</td> <td class="num"><strong>${r.appointments || 0}</strong></td> <td class="num"><strong>${r.listings || 0}</strong></td> </tr> `).join(''); } /** Fetches stats for the current period and renders the table */ async function loadStats() { showLoader(); try { const data = await apiCall('GET', { action: "stats", period: currentPeriod }); renderLeaderboard(Array.isArray(data.totals) ? data.totals : []); } catch (e) { renderLeaderboard([]); } } /** Handles the form submission */ async function handleFormSubmit(e) { e.preventDefault(); const agent = agentInputEl.value.trim(); if (!agent) { alert("Please enter an agent name."); return; } const originalButtonText = submitBtn.innerHTML; submitBtn.innerHTML = "Saving..."; submitBtn.disabled = true; try { const entry = { date: dateEl.value || getTodayISO(), agent }; numberFields.forEach(field => { entry[field] = Number(document.getElementById(field).value || 0); }); // Register agent if they are new if (!knownAgents.includes(agent)) { await apiCall('POST', { action: "registeragent", agent }); } // Submit the daily entry await apiCall('POST', { action: "submit", entry }); // --- Success --- // Reset form for next entry agentInputEl.value = ""; numberFields.forEach(field => document.getElementById(field).value = 0); // Reload agents and stats await Promise.all([loadAgents(), loadStats()]); // Briefly show success submitBtn.innerHTML = "Saved ✔"; setTimeout(() => { submitBtn.innerHTML = originalButtonText; submitBtn.disabled = false; }, 2000); } catch (err) { alert("Save failed: " + err.message); submitBtn.innerHTML = originalButtonText; submitBtn.disabled = false; } } // ================================================================= // EVENT LISTENERS // ================================================================= formEl.addEventListener('submit', handleFormSubmit); clearBtn.addEventListener('click', () => { numberFields.forEach(field => document.getElementById(field).value = 0); }); tabs.forEach(btn => { btn.addEventListener('click', () => { currentPeriod = btn.dataset.period; tabs.forEach(b => b.classList.remove('active')); btn.classList.add('active'); loadStats(); }); }); refreshBtn.addEventListener('click', loadStats); // ================================================================= // INITIALIZATION // ================================================================= /** Main function to initialize the app */ async function init() { dateEl.value = getTodayISO(); await pingBackend(); await loadAgents(); await loadStats(); } // Run the app init(); </script> </body> </html>
