<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>KWE Agent LeadGen ScoreBoard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-neutral-950 text-white">
  <div id="root"></div>

  <script>
    const { useEffect, useMemo, useState } = React;

    /* ---------------- Error boundary (avoid blank screen) ---------------- */
    class ErrorBoundary extends React.Component {
      constructor(props){ super(props); this.state = { hasError:false, err:'' }; }
      static getDerivedStateFromError(error){ return { hasError:true, err:String(error) }; }
      componentDidCatch(error, info){ console.error('Render error:', error, info); }
      render(){
        if (this.state.hasError){
          return React.createElement('div', { className:'min-h-screen bg-neutral-950 text-white p-6' },
            React.createElement('div', { className:'mx-auto max-w-2xl rounded-2xl border border-red-800 bg-red-950/40 p-4' },
              React.createElement('h2', { className:'text-lg font-semibold text-red-300' }, 'Something went wrong'),
              React.createElement('p', { className:'mt-2 text-sm text-red-200 whitespace-pre-wrap' }, this.state.err),
              React.createElement('p', { className:'mt-3 text-xs text-neutral-400' }, 'Check your backend URL/token in the header.')
            )
          );
        }
        return this.props.children;
      }
    }

    function App(){
      document.title = "KWE Agent LeadGen ScoreBoard";

      /* ---------------- Config ---------------- */
      const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbw6OqlTUTHCicI0TNtGH9IbnAS31T6cUqev0qY-fEZ94bZ9RvCf0R0z935mV8Is0JvX/exec";
      const DEFAULT_TOKEN = "09e0efc10739462a87438a386b92a44f1a0542ed7d5a4054883fb685d14c0142";

      const getLS=(k,f="")=>{ try{ return typeof window!=='undefined'?(localStorage.getItem(k)||f):f }catch{ return f } };
      const setLS=(k,v)=>{ try{ if(typeof window!=='undefined') localStorage.setItem(k,v) }catch{} };

      const [backendUrl, setBackendUrl] = useState(() => getLS("kwe_url", DEFAULT_URL));
      const [token, setToken] = useState(() => getLS("kwe_token", DEFAULT_TOKEN));

      /* ---------------- UI State ---------------- */
      const tabs = [
        { key: "daily", label: "Today" },
        { key: "weekly", label: "This Week" },
        { key: "monthly", label: "This Month" },
      ];
      const metricDefs = [
        { key:"dials",        label:"Dials" },
        { key:"answered",     label:"Calls Answered" },
        { key:"whatsapps",    label:"Whatsapps" },
        { key:"nos",          label:"NO’s" },
        { key:"appointments", label:"Appointments made" },
        { key:"listings",     label:"Listings" },
      ];

      const [layout, setLayout] = useState("scoreboard");
      const [view, setView] = useState("daily");
      const [sortKey, setSortKey] = useState("appointments");
      const [selectedMetric, setSelectedMetric] = useState("appointments");
      const [query, setQuery] = useState("");
      const [status, setStatus] = useState({ ok:false, msg:"Not connected" });
      const [lastError, setLastError] = useState("");

      // leaderboard rows
      const [rows, setRows] = useState([]);
      // agents
      const [agents, setAgents] = useState([]);
      const [selectedAgent, setSelectedAgent] = useState("");
      const [newAgent, setNewAgent] = useState("");

      // submit form
      const todayISO = new Date().toISOString().slice(0,10);
      const [date, setDate] = useState(todayISO);
      const EMPTY_VALS = { dials:0, answered:0, whatsapps:0, nos:0, appointments:0, listings:0 };
      const [formVals, setFormVals] = useState(EMPTY_VALS);

      // matrix/week series
      const [matrixAgent, setMatrixAgent] = useState(""); // '' = ALL agents
      const [series, setSeries] = useState([]);           // current week days
      const [seriesByWeek, setSeriesByWeek] = useState({}); // { weekStartISO: days[] }

      function saveConfig(u,t){ setLS("kwe_url", u); setLS("kwe_token", t); }
      function resetForm(){ const t=new Date().toISOString().slice(0,10); setDate(t); setSelectedAgent(""); setNewAgent(""); setFormVals(EMPTY_VALS); }

      async function apiGET(params){
        const qp = new URLSearchParams({ ...params, token });
        const res = await fetch(`${backendUrl}?${qp.toString()}`);
        let data; try { data = await res.json(); } catch { data = { ok:false, error:"Invalid JSON" }; }
        if (!res.ok || data.error) throw new Error(data.error || `GET ${params.action} failed: ${res.status}`);
        return data;
      }
      async function apiPOST(obj){
        const payload = JSON.stringify({ ...obj, token });
        const body = new URLSearchParams({ payload });
        const res = await fetch(backendUrl, { method:"POST", body });
        let data; try { data = await res.json(); } catch { data = { ok:false, error:"Invalid JSON" }; }
        if (!res.ok || data.error) throw new Error(data.error || `POST ${obj.action} failed: ${res.status}`);
        return data;
      }

      async function loadAgents(){
        try {
          const d = await apiGET({ action:"agents" });
          const list = Array.isArray(d.agents) ? d.agents : [];
          setAgents(list);
          if (!selectedAgent && list.length) setSelectedAgent(list[0]);
        } catch (e) { setLastError(String(e.message||e)); }
      }
      async function loadStats(period=view){
        try {
          const d = await apiGET({ action:"stats", period });
          const totals = Array.isArray(d.totals) ? d.totals : [];
          setRows(totals.map(r => ({
            agent:r.agent||"", dials:r.dials||0, answered:r.answered||0,
            whatsapps:r.whatsapps||0, nos:r.nos||0, appointments:r.appointments||0, listings:r.listings||0
          })));
        } catch (e) { setRows([]); setLastError(String(e.message||e)); }
      }
      async function ping(){
        try { const d = await apiGET({ action:"ping" }); setStatus({ ok:!!d.ok, msg:"Connected" }); }
        catch (e) { setStatus({ ok:false, msg:"Connection failed" }); setLastError(String(e.message||e)); }
      }

      // time helpers
      function startOfWeekMonday(d){ const dt=new Date(d); const day=dt.getDay(); const diff=day===0?-6:1-day; dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt; }
      function addDays(d,n){ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt; }
      function iso(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
      const fmtZA = (d,opts)=>d.toLocaleDateString("en-ZA",opts);
      function fmtWeekLabel(d){ return `Week of ${fmtZA(d,{day:"2-digit",month:"short",year:"numeric"})}`; }

      // series loaders
      async function loadWeekSeries(weekStartDate, agent=""){
        const startISO=iso(weekStartDate); const endISO=iso(addDays(weekStartDate,6));
        const d = await apiGET({ action:"timeseries", start:startISO, end:endISO, agent });
        return Array.isArray(d.days) ? d.days : [];
      }

      // initial + when config changes
      useEffect(() => { if (!backendUrl || !token) return; ping(); loadAgents(); loadStats(view); }, [backendUrl, token, view]);

      // matrix current week
      const currentWeekStart = startOfWeekMonday(new Date());
      useEffect(() => {
        if (layout!=="matrix" && layout!=="weekmatrix") return;
        (async () => { try { const s = await loadWeekSeries(currentWeekStart, matrixAgent); setSeries(s); } catch { setSeries([]); } })();
      }, [layout, matrixAgent, backendUrl, token]);

      // weekmatrix last 5 weeks
      const weekStarts = Array.from({length:5}, (_,i) => addDays(currentWeekStart, -7*i));
      useEffect(() => {
        if (layout!=="weekmatrix") return;
        (async () => {
          const entries = await Promise.all(
            weekStarts.map(ws => loadWeekSeries(ws, matrixAgent)
              .then(days => [iso(ws), days])
              .catch(()  => [iso(ws), []])
            )
          );
          const map = {}; entries.forEach(([k,days]) => map[k]=days);
          setSeriesByWeek(map);
        })();
      }, [layout, matrixAgent, backendUrl, token]);

      // derived leaderboard
      const data = useMemo(() =>
        rows
          .filter(r => (r.agent||"").toLowerCase().includes((query||"").toLowerCase()))
          .sort((a,b) => (b[sortKey]||0) - (a[sortKey]||0))
          .map((r,i) => ({ ...r, rank:i+1 }))
      , [rows, sortKey, query]);

      const chartData = useMemo(() => {
        const max = Math.max(1, ...data.map(d => d[selectedMetric]||0));
        return data.map(d => ({ agent:d.agent||"", value:d[selectedMetric]||0, pct:((d[selectedMetric]||0)/max)*100 }));
      }, [data, selectedMetric]);

      async function onSubmit(e){
        e.preventDefault();
        if (!token) return alert("Please set your API token.");
        const agent = (newAgent.trim() || selectedAgent || "").trim();
        if (!agent) return alert("Select or enter an agent name.");
        const entry = { date, agent, ...formVals };
        try {
          const res = await apiPOST({ action:"submit", entry });
          if (res.ok){
            if (newAgent.trim()) await apiPOST({ action:"registeragent", agent });
            resetForm();
            await loadAgents(); await loadStats(view);
            // refresh matrix views if visible
            if (layout==="matrix" || layout==="weekmatrix"){
              try {
                const s = await loadWeekSeries(currentWeekStart, matrixAgent);
                setSeries(s);
                if (layout==="weekmatrix"){
                  const entries = await Promise.all(
                    weekStarts.map(ws => loadWeekSeries(ws, matrixAgent).then(days => [iso(ws),days]))
                  );
                  const map = {}; entries.forEach(([k,days]) => map[k]=days); setSeriesByWeek(map);
                }
              } catch {}
            }
            alert("Saved ✔");
          }
        } catch (e) { alert("Save failed: " + (e.message||e)); }
      }
      async function onSendEmail(){
        try { const r = await apiPOST({ action:"email", period:view }); if (r.ok) alert("Email sent ✔"); }
        catch (e) { alert("Email failed: " + (e.message||e)); }
      }

      // Render series table (Mon–Fri, totals per metric)
      function MatrixTable({ heading, weekStart, days }){
        const headers = [0,1,2,3,4].map(i => {
          const d = addDays(weekStart, i);
          return { label: `${d.toLocaleDateString("en-ZA",{weekday:"short"})} ${fmtZA(d,{day:"2-digit",month:"short"})}`, iso: iso(d) };
        });
        const byDate = {}; (days||[]).forEach(d => byDate[d.date]=d);

        return React.createElement('div', { className:'mb-6 rounded-2xl border-4 border-black bg-white text-black shadow-xl' },
          heading && React.createElement('div', { className:'border-b-4 border-black px-4 py-2 text-base font-bold' }, heading),
          React.createElement('div', { className:'overflow-auto p-3' },
            React.createElement('table', { className:'min-w-[900px] border-separate border-spacing-0' },
              React.createElement('thead', null,
                React.createElement('tr', null,
                  React.createElement('th', { className:'sticky left-0 z-10 bg-white px-3 py-2 text-left text-[13px] font-bold border-2 border-black' }, 'Metric'),
                  ...headers.map(h => React.createElement('th', { key:h.iso, className:'px-4 py-2 text-center text-[13px] font-bold border-2 border-black whitespace-nowrap' }, h.label))
                )
              ),
              React.createElement('tbody', null,
                ...metricDefs.map(m => React.createElement('tr', { key:m.key },
                  React.createElement('td', { className:'sticky left-0 z-10 bg-white px-3 py-2 text-[13px] font-semibold border-2 border-black' }, m.label),
                  ...headers.map(h => {
                    const val = (byDate[h.iso]?.[m.key]) || 0;
                    return React.createElement('td', { key:h.iso, className:'border-2 border-black px-3 py-2 text-right tabular-nums' }, val);
                  })
                ))
              )
            )
          )
        );
      }

      const needsSetup = !token || !backendUrl;

      /* ---------------- Render ---------------- */
      return React.createElement(ErrorBoundary, null,
        React.createElement('div', { className:'min-h-screen bg-gradient-to-b from-[#0E0E10] to-[#1A1A1D] text-white' },
          /* Header */
          React.createElement('header', { className:'sticky top-0 z-50 border-b border-neutral-800/80 bg-black/50 backdrop-blur' },
            React.createElement('div', { className:'mx-auto max-w-6xl px-4 py-3' },
              React.createElement('div', { className:'flex flex-wrap items-center gap-4 justify-between' },
                React.createElement('div', { className:'flex items-center gap-3' },
                  React.createElement('div', { className:'grid h-10 w-10 place-items-center rounded-xl bg-[#C70000] font-extrabold shadow-[0_6px_14px_rgba(199,0,0,0.35)]' }, 'KW'),
                  React.createElement('div', null,
                    React.createElement('h1', { className:'m-0 text-[20px] font-semibold tracking-tight' }, 'KWE Agent LeadGen ScoreBoard'),
                    React.createElement('p', { className:'m-0 text-xs text-neutral-400' }, 'Daily inputs → Weekly & Monthly leaderboards · Africa/Johannesburg')
                  )
                ),
                /* Connection settings */
                React.createElement('div', { className:'flex flex-wrap items-center gap-2' },
                  React.createElement('input', { value:backendUrl, onChange:e=>setBackendUrl(e.target.value), onBlur:()=>saveConfig(backendUrl,token), placeholder:'Backend URL', className:'w-[360px] rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-[12px]' }),
                  React.createElement('input', { value:token, onChange:e=>setToken(e.target.value), onBlur:()=>saveConfig(backendUrl,token), placeholder:'API Token', className:'w-[320px] rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-[12px]' }),
                  React.createElement('div', { className:`inline-flex items-center gap-2 rounded-full border px-3 py-1 text-xs ${status.ok?'border-emerald-700 bg-emerald-900/40 text-emerald-200':'border-neutral-700 bg-neutral-900 text-neutral-300'}` }, status.ok ? 'Connected' : 'Connection failed')
                )
              ),
              /* Layout toggles */
              React.createElement('div', { className:'mt-3 flex flex-wrap items-center gap-2' },
                React.createElement('button', { onClick:()=>setLayout('scoreboard'), className:`rounded-lg border px-3 py-2 text-xs ${layout==='scoreboard'?'border-red-700 bg-[#C70000]':'border-neutral-700 bg-neutral-900'}` }, 'Scoreboard'),
                React.createElement('button', { onClick:()=>setLayout('matrix'), className:`rounded-lg border px-3 py-2 text-xs ${layout==='matrix'?'border-red-700 bg-[#C70000]':'border-neutral-700 bg-neutral-900'}` }, 'Matrix'),
                React.createElement('button', { onClick:()=>setLayout('weekmatrix'), className:`rounded-lg border px-3 py-2 text-xs ${layout==='weekmatrix'?'border-red-700 bg-[#C70000]':'border-neutral-700 bg-neutral-900'}` }, 'Week-on-Week'),
                lastError && React.createElement('span', { className:'ml-2 text-xs text-red-300' }, lastError)
              )
            )
          ),

          /* Main */
          React.createElement('main', { className:'mx-auto max-w-6xl px-4 py-6' },
            needsSetup && React.createElement('div', { className:'mb-4 rounded-xl border border-yellow-800 bg-yellow-950/30 p-4' },
              React.createElement('h3', { className:'text-sm font-semibold text-yellow-200' }, 'Setup'),
              React.createElement('p', { className:'mt-1 text-xs text-yellow-100' }, 'Token & URL persist locally in your browser.')
            ),

            /* Scoreboard */
            layout==='scoreboard' && React.createElement('div', { className:'grid grid-cols-1 gap-4 lg:grid-cols-[1.2fr_1fr]' },
              React.createElement('section', { className:'rounded-2xl border border-neutral-800 bg-neutral-950/60 shadow-xl' },
                React.createElement('div', { className:'border-b border-neutral-800/80 bg-gradient-to-b from-neutral-900 to-neutral-950 rounded-t-2xl p-4' },
                  React.createElement('div', { className:'flex items-center justify-between' },
                    React.createElement('h2', { className:'text-base font-semibold' }, 'Leaderboard'),
                    React.createElement('div', { className:'flex items-center gap-2' },
                      ...tabs.map(t => React.createElement('button', {
                        key:t.key, onClick:()=>setView(t.key),
                        className:`rounded-lg border px-3 py-2 text-xs ${view===t.key?'border-red-700 bg-[#C70000] text-white':'border-neutral-700 bg-neutral-900 text-neutral-300 hover:bg-neutral-800'}`
                      }, t.label))
                    )
                  )
                ),
                React.createElement('div', { className:'p-4' },
                  React.createElement('div', { className:'mt-0 flex flex-wrap items-center gap-3' },
                    React.createElement('input', { placeholder:'Search agents…', value:query, onChange:e=>setQuery(e.target.value), className:'ml-1 w-64 rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm placeholder:text-neutral-500 focus:outline-none focus:ring-2 focus:ring-red-700' }),
                    React.createElement('div', { className:'ml-auto flex items-center gap-2 text-xs text-neutral-400' }, 'Sort by',
                      React.createElement('select', { className:'rounded-lg border border-neutral-700 bg-neutral-900 px-2 py-2 text-xs text-neutral-100', value:sortKey, onChange:e=>setSortKey(e.target.value) },
                        ...metricDefs.map(m => React.createElement('option', { key:m.key, value:m.key }, m.label))
                      )
                    )
                  ),
                  React.createElement('div', { className:'mt-3 max-h-[520px] overflow-auto rounded-xl border border-neutral-800' },
                    React.createElement('table', { className:'w-full border-collapse text-sm' },
                      React.createElement('thead', { className:'sticky top-0 z-10 bg-neutral-950' },
                        React.createElement('tr', { className:'border-b border-neutral-800 text-right text-[11px] uppercase tracking-wide text-neutral-400' },
                          React.createElement('th', { className:'p-2 text-left' }, 'Agent'),
                          React.createElement('th', { className:'p-2' }, 'Dials'),
                          React.createElement('th', { className:'p-2' }, 'Calls Answered'),
                          React.createElement('th', { className:'p-2' }, 'Whatsapps'),
                          React.createElement('th', { className:'p-2' }, 'NO’s'),
                          React.createElement('th', { className:'p-2' }, 'Appointments'),
                          React.createElement('th', { className:'p-2' }, 'Listings')
                        )
                      ),
                      React.createElement('tbody', null,
                        ...data.map(r => React.createElement('tr', { key:r.agent + r.rank, className:'border-b border-neutral-900/60 hover:bg-neutral-900/40' },
                          React.createElement('td', { className:'p-2 text-left' },
                            React.createElement('span', { className:'mr-2 inline-flex min-w-6 items-center justify-center rounded-full border border-neutral-700 bg-neutral-900 px-2 py-0.5 text-xs text-neutral-200' }, r.rank),
                            r.agent || '(no name)'
                          ),
                          React.createElement('td', { className:'p-2 text-right tabular-nums' }, r.dials),
                          React.createElement('td', { className:'p-2 text-right tabular-nums' }, r.answered),
                          React.createElement('td', { className:'p-2 text-right tabular-nums' }, r.whatsapps),
                          React.createElement('td', { className:'p-2 text-right tabular-nums' }, r.nos),
                          React.createElement('td', { className:'p-2 text-right tabular-nums font-semibold' }, r.appointments),
                          React.createElement('td', { className:'p-2 text-right tabular-nums font-semibold' }, r.listings)
                        )),
                        !data.length && React.createElement('tr', null, React.createElement('td', { className:'p-4 text-center text-neutral-400', colSpan:7 }, 'No data yet.'))
                      )
                    )
                  ),
                  React.createElement('div', { className:'mt-3 flex flex-wrap items-center gap-2' },
                    React.createElement('span', { className:'text-xs text-neutral-400' }, 'Metric for chart:'),
                    ...metricDefs.map(m => React.createElement('button', { key:m.key, onClick:()=>setSelectedMetric(m.key), className:`rounded-lg border px-2 py-1 text-xs ${selectedMetric===m.key?'border-red-700 bg-[#C70000] text-white':'border-neutral-700 bg-neutral-900 text-neutral-300 hover:bg-neutral-800'}` }, m.label))
                  ),
                  React.createElement('div', { className:'mt-4 rounded-xl border border-neutral-800 p-4' },
                    React.createElement('h3', { className:'mb-3 text-sm font-semibold text-neutral-200' }, `Top Performers — ${metricDefs.find(m=>m.key===selectedMetric)?.label}`),
                    React.createElement('div', { className:'space-y-2' },
                      ...chartData.map((row, idx) => React.createElement('div', { key:row.agent + idx },
                        React.createElement('div', { className:'flex items-center justify-between text-xs text-neutral-400' },
                          React.createElement('span', { className:'truncate pr-2' }, row.agent || '(no name)'),
                          React.createElement('span', { className:'tabular-nums text-neutral-200' }, row.value)
                        ),
                        React.createElement('div', { className:'mt-1 h-2 w-full rounded-full bg-neutral-800' },
                          React.createElement('div', { className:'h-2 rounded-full bg-[#C70000]', style:{ width: `${Math.max(3,row.pct)}%` } })
                        )
                      )),
                      !chartData.length && React.createElement('div', { className:'text-xs text-neutral-500' }, 'No data.')
                    )
                  ),
                  React.createElement('div', { className:'mt-3 flex flex-wrap items-center gap-2' },
                    React.createElement('button', { onClick:()=>loadStats(view), className:'rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold hover:brightness-110' }, 'Refresh Leaderboard'),
                    React.createElement('button', { onClick:onSendEmail, className:'rounded-lg bg-red-600 px-3 py-2 text-sm font-semibold hover:brightness-110' }, `Send ${tabs.find(t=>t.key===view)?.label} Email`)
                  )
                )
              ),
              /* Submit */
              React.createElement('section', { className:'rounded-2xl border border-neutral-800 bg-neutral-950/60 shadow-xl' },
                React.createElement('div', { className:'border-b border-neutral-800/80 bg-gradient-to-b from-neutral-900 to-neutral-950 rounded-t-2xl p-4' },
                  React.createElement('h2', { className:'text-base font-semibold' }, 'Submit Daily Activity')
                ),
                React.createElement('div', { className:'p-4' },
                  React.createElement('form', { onSubmit:onSubmit },
                    React.createElement('div', { className:'grid grid-cols-1 gap-3 md:grid-cols-4' },
                      React.createElement('div', null,
                        React.createElement('label', { className:'mb-1 block text-xs text-neutral-400' }, 'Date'),
                        React.createElement('input', { type:'date', value:date, onChange:e=>setDate(e.target.value), className:'w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm' })
                      ),
                      React.createElement('div', null,
                        React.createElement('label', { className:'mb-1 block text-xs text-neutral-400' }, 'Agent Name'),
                        React.createElement('select', { value:selectedAgent, onChange:e=>setSelectedAgent(e.target.value), className:'w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm' },
                          React.createElement('option', { value:'' }, '— Select —'),
                          ...agents.map(a => React.createElement('option', { key:a, value:a }, a))
                        )
                      ),
                      React.createElement('div', null,
                        React.createElement('label', { className:'mb-1 block text-xs text-neutral-400' }, 'Or add new agent'),
                        React.createElement('input', { value:newAgent, onChange:e=>setNewAgent(e.target.value), placeholder:'Type new name', className:'w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm' })
                      ),
                      React.createElement('div', { className:'flex items-end gap-2' },
                        React.createElement('button', { className:'w-full rounded-lg bg-[#C70000] px-3 py-2 text-sm font-semibold shadow-[0_6px_14px_rgba(199,0,0,0.35)] hover:brightness-110' }, 'Save Entry'),
                        React.createElement('button', { type:'button', onClick:resetForm, className:'rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm' }, 'Reset')
                      )
                    ),
                    React.createElement('div', { className:'mt-3 grid grid-cols-1 gap-3 md:grid-cols-3' },
                      ...metricDefs.map(m => React.createElement('div', { key:m.key },
                        React.createElement('label', { className:'mb-1 block text-xs text-neutral-400' }, m.label),
                        React.createElement('input', {
                          type:'number', min:0, value:formVals[m.key] ?? 0,
                          onChange:e=>setFormVals(v=>Object.assign({}, v, { [m.key]: Number(e.target.value||0) })),
                          className:'w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm text-right'
                        })
                      ))
                    )
                  )
                )
              )
            ),

            /* Matrix (wired to backend) */
            layout==='matrix' && React.createElement('section', { className:'rounded-2xl border border-neutral-200 bg-white text-black shadow-xl' },
              React.createElement('div', { className:'border-b border-neutral-200 rounded-t-2xl p-4' },
                React.createElement('h2', { className:'text-base font-semibold' }, 'Matrix — Mon–Fri (current week)'),
                React.createElement('div', { className:'mt-2 flex flex-wrap items-center gap-2 text-sm' },
                  React.createElement('span', { className:'text-neutral-600' }, 'Agent filter:'),
                  React.createElement('select', { value:matrixAgent, onChange:e=>setMatrixAgent(e.target.value), className:'rounded border border-neutral-300 bg-white px-2 py-1' },
                    React.createElement('option', { value:'' }, 'All agents'),
                    ...agents.map(a => React.createElement('option', { key:a, value:a }, a))
                  )
                )
              ),
              React.createElement('div', { className:'p-4' },
                React.createElement(MatrixTable, { heading:fmtWeekLabel(currentWeekStart), weekStart:currentWeekStart, days:series })
              )
            ),

            /* Week-on-Week (wired) */
            layout==='weekmatrix' && React.createElement('section', { className:'rounded-2xl border border-neutral-200 bg-white text-black shadow-xl' },
              React.createElement('div', { className:'border-b border-neutral-200 rounded-t-2xl p-4' },
                React.createElement('h2', { className:'text-base font-semibold' }, 'Week-on-Week — last 5 weeks'),
                React.createElement('div', { className:'mt-2 flex flex-wrap items-center gap-2 text-sm' },
                  React.createElement('span', { className:'text-neutral-600' }, 'Agent filter:'),
                  React.createElement('select', { value:matrixAgent, onChange:e=>setMatrixAgent(e.target.value), className:'rounded border border-neutral-300 bg-white px-2 py-1' },
                    React.createElement('option', { value:'' }, 'All agents'),
                    ...agents.map(a => React.createElement('option', { key:a, value:a }, a))
                  )
                )
              ),
              React.createElement('div', { className:'p-4' },
                ...weekStarts.map((ws,i) => React.createElement(MatrixTable, {
                  key:i, heading:fmtWeekLabel(ws), weekStart:ws, days: (seriesByWeek[iso(ws)] || [])
                }))
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(App)
    );
  </script>
</body>
</html>
