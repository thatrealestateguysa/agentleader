<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KWE Call Tracker — Scoreboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 + Babel (for inline JSX) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbw6OqlTUTHCicI0TNtGH9IbnAS31T6cUqev0qY-fEZ94bZ9RvCf0R0z935mV8Is0JvX/exec";

      const [backendUrl, setBackendUrl] = useState(() => localStorage.getItem("kwe_url") || DEFAULT_URL);
      const [token, setToken] = useState(() => localStorage.getItem("kwe_token") || "");

      const tabs = [
        { key: "daily", label: "Today" },
        { key: "weekly", label: "This Week" },
        { key: "monthly", label: "This Month" },
      ];
      const metricDefs = [
        { key: "dials", label: "Dials" },
        { key: "answered", label: "Calls Answered" },
        { key: "whatsapps", label: "Whatsapps" },
        { key: "nos", label: "NO’s" },
        { key: "appointments", label: "Appointments made" },
        { key: "listings", label: "Listings" },
      ];

      const [layout, setLayout] = useState("scoreboard");
      const [view, setView] = useState("daily");
      const [sortKey, setSortKey] = useState("appointments");
      const [selectedMetric, setSelectedMetric] = useState("appointments");
      const [query, setQuery] = useState("");
      const [status, setStatus] = useState({ ok: false, msg: "Not connected" });

      const [rows, setRows] = useState([]);
      const [agents, setAgents] = useState([]);
      const [selectedAgent, setSelectedAgent] = useState("");
      const [newAgent, setNewAgent] = useState("");

      const todayISO = new Date().toISOString().slice(0, 10);
      const [date, setDate] = useState(todayISO);
      const [formVals, setFormVals] = useState({
        dials: 0, answered: 0, whatsapps: 0, nos: 0, appointments: 0, listings: 0,
      });

      function saveConfig(u, t) {
        localStorage.setItem("kwe_url", u);
        localStorage.setItem("kwe_token", t);
      }
      async function apiGET(params) {
        const qp = new URLSearchParams({ ...params, token });
        const res = await fetch(`${backendUrl}?${qp.toString()}`);
        if (!res.ok) throw new Error(\`GET \${params.action} failed: \${res.status}\`);
        return res.json();
      }
      async function apiPOST(obj) {
        const payload = JSON.stringify({ ...obj, token });
        const body = new URLSearchParams({ payload });
        const res = await fetch(backendUrl, { method: "POST", body });
        if (!res.ok) throw new Error(\`POST \${obj.action} failed: \${res.status}\`);
        return res.json();
      }

      async function loadAgents() {
        try {
          const data = await apiGET({ action: "agents" });
          const list = data.agents || [];
          setAgents(list);
          if (!selectedAgent && list.length) setSelectedAgent(list[0]);
        } catch (e) {
          console.error(e);
        }
      }
      async function loadStats(period = view) {
        try {
          const data = await apiGET({ action: "stats", period });
          const totals = data.totals || [];
          setRows(totals.map(r => ({
            agent: r.agent,
            dials: r.dials || 0,
            answered: r.answered || 0,
            whatsapps: r.whatsapps || 0,
            nos: r.nos || 0,
            appointments: r.appointments || 0,
            listings: r.listings || 0,
          })));
        } catch (e) {
          console.error(e);
          setRows([]);
        }
      }
      async function ping() {
        try { const data = await apiGET({ action: "ping" });
          setStatus({ ok: !!data.ok, msg: "Connected" });
        } catch (e) {
          setStatus({ ok: false, msg: "Connection failed" });
        }
      }

      useEffect(() => {
        if (!backendUrl || !token) return;
        ping(); loadAgents(); loadStats(view);
      }, [backendUrl, token, view]);

      const data = useMemo(() =>
        rows
          .filter(r => r.agent.toLowerCase().includes(query.toLowerCase()))
          .sort((a,b) => (b[sortKey]||0) - (a[sortKey]||0))
          .map((r,i) => ({ ...r, rank: i+1 }))
      , [rows, sortKey, query]);

      const chartData = useMemo(() => {
        const max = Math.max(1, ...data.map(d => d[selectedMetric] || 0));
        return data.map(d => ({ agent: d.agent, value: d[selectedMetric] || 0, pct: ((d[selectedMetric]||0)/max)*100 }));
      }, [data, selectedMetric]);

      async function onSubmit(e) {
        e.preventDefault();
        if (!token) return alert("Please set your API token.");
        const agent = newAgent.trim() || selectedAgent || "";
        if (!agent) return alert("Select or enter an agent name.");
        const entry = { date, agent, ...formVals };
        try {
          const result = await apiPOST({ action: "submit", entry });
          if (result.ok) {
            if (newAgent.trim()) await apiPOST({ action: "registeragent", agent });
            setNewAgent(""); await loadAgents(); await loadStats(view);
            alert("Saved ✔");
          } else { alert("Save failed: " + (result.error || "unknown error")); }
        } catch (e) { alert("Save failed: " + e.message); }
      }
      async function onSendEmail() {
        try {
          const result = await apiPOST({ action: "email", period: view });
          if (result.ok) alert("Email sent ✔"); else alert("Email failed: " + (result.error || "unknown error"));
        } catch (e) { alert("Email failed: " + e.message); }
      }

      // Matrix (visual) helpers — South African formatting
      function startOfWeekMonday(d) { const dt=new Date(d); const day=dt.getDay(); const diff=day===0?-6:1-day; dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt; }
      function addDays(d,n){ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt; }
      const fmtZA = (d,opts)=> d.toLocaleDateString("en-ZA",opts);
      function fmtWeekLabel(d){ const label=fmtZA(d,{day:"2-digit",month:"short",year:"numeric"}); return `Week of ${label}`; }
      function dayHeaderLabels(weekStart){
        return Array.from({length:5},(_,i)=>{ const date=addDays(weekStart,i);
          const dow=date.toLocaleDateString("en-ZA",{weekday:"short"});
          const dmy=fmtZA(date,{day:"2-digit",month:"short"}); return `${dow} ${dmy}`; });
      }
      const currentWeekStart = startOfWeekMonday(new Date());
      const weekStarts = Array.from({ length: 5 }, (_, i) => addDays(currentWeekStart, -7*i));

      function MatrixTable({ heading, weekStart }) {
        const headers = dayHeaderLabels(weekStart || currentWeekStart);
        const baseRows = [{ key: "date", label: "Date", inputType: "date" }, ...metricDefs];
        return (
          <div className="mb-6 rounded-2xl border-4 border-black bg-white text-black shadow-xl">
            {heading && (<div className="border-b-4 border-black px-4 py-2 text-base font-bold">{heading}</div>)}
            <div className="overflow-auto p-3">
              <table className="min-w-[1100px] border-separate border-spacing-0">
                <thead>
                  <tr>
                    <th className="sticky left-0 z-10 bg-white px-3 py-2 text-left text-[13px] font-bold border-2 border-black">Agent Name</th>
                    {headers.map((name, idx) => (
                      <th key={idx} className="px-4 py-2 text-center text-[13px] font-bold border-2 border-black whitespace-nowrap">{name}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {baseRows.map((row) => (
                    <tr key={row.key}>
                      <td className="sticky left-0 z-10 bg-white px-3 py-2 text-[13px] font-semibold border-2 border-black">{row.label}</td>
                      {headers.map((_, i) => (
                        <td key={i} className="border-2 border-black px-3 py-2">
                          {row.inputType === "date"
                            ? <input type="date" className="w-40 rounded border border-neutral-300 px-2 py-1 text-[13px] focus:outline-none" />
                            : <input type="number" min={0} defaultValue={0} className="w-20 rounded border border-neutral-300 px-2 py-1 text-right text-[13px] focus:outline-none" />
                          }
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-b from-[#0E0E10] to-[#1A1A1D] text-white">
          {/* Header */}
          <header className="sticky top-0 z-50 border-b border-neutral-800/80 bg-black/50 backdrop-blur">
            <div className="mx-auto max-w-6xl px-4 py-3">
              <div className="flex flex-wrap items-center gap-4 justify-between">
                <div className="flex items-center gap-3">
                  <div className="grid h-10 w-10 place-items-center rounded-xl bg-[#C70000] font-extrabold shadow-[0_6px_14px_rgba(199,0,0,0.35)]">KW</div>
                  <div>
                    <h1 className="m-0 text-[20px] font-semibold tracking-tight">KWE Call Tracker — Scoreboard</h1>
                    <p className="m-0 text-xs text-neutral-400">Daily inputs → Weekly & Monthly leaderboards · Africa/Johannesburg</p>
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <input value={backendUrl} onChange={(e)=>setBackendUrl(e.target.value)} onBlur={()=>saveConfig(backendUrl, token)} placeholder="Backend URL" className="w-[360px] rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-[12px]" />
                  <input value={token} onChange={(e)=>setToken(e.target.value)} onBlur={()=>saveConfig(backendUrl, token)} placeholder="API Token" className="w-[180px] rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-[12px]" />
                  <div className={`inline-flex items-center gap-2 rounded-full border px-3 py-1 text-xs ${status.ok?'border-emerald-700 bg-emerald-900/40 text-emerald-200':'border-neutral-700 bg-neutral-900 text-neutral-300'}`}>
                    {status.ok ? "Connected" : status.msg}
                  </div>
                </div>
              </div>
            </div>
          </header>

          {/* Main */}
          <main className="mx-auto max-w-6xl px-4 py-6">
            {/* Scoreboard layout */}
            <div className="grid grid-cols-1 gap-4 lg:grid-cols-[1.2fr_1fr]">
              <section className="rounded-2xl border border-neutral-800 bg-neutral-950/60 shadow-xl">
                <div className="border-b border-neutral-800/80 bg-gradient-to-b from-neutral-900 to-neutral-950 rounded-t-2xl p-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-base font-semibold">Leaderboard</h2>
                    <div className="flex items-center gap-2">
                      {tabs.map(t => (
                        <button key={t.key} onClick={()=>setView(t.key)} className={"rounded-lg border px-3 py-2 text-xs " + (view===t.key ? "border-red-700 bg-[#C70000] text-white" : "border-neutral-700 bg-neutral-900 text-neutral-300 hover:bg-neutral-800")}>
                          {t.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="mt-3 flex flex-wrap items-center gap-3">
                    <input placeholder="Search agents…" value={query} onChange={e=>setQuery(e.target.value)} className="ml-1 w-64 rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm placeholder:text-neutral-500 focus:outline-none focus:ring-2 focus:ring-red-700" />
                    <div className="ml-auto flex items-center gap-2 text-xs text-neutral-400">
                      Sort by
                      <select className="rounded-lg border border-neutral-700 bg-neutral-900 px-2 py-2 text-xs text-neutral-100" value={sortKey} onChange={e=>setSortKey(e.target.value)}>
                        {metricDefs.map(m => <option key={m.key} value={m.key}>{m.label}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="mt-3 max-h-[520px] overflow-auto rounded-xl border border-neutral-800">
                    <table className="w-full border-collapse text-sm">
                      <thead className="sticky top-0 z-10 bg-neutral-950">
                        <tr className="border-b border-neutral-800 text-right text-[11px] uppercase tracking-wide text-neutral-400">
                          <th className="p-2 text-left">Agent</th>
                          <th className="p-2">Dials</th>
                          <th className="p-2">Calls Answered</th>
                          <th className="p-2">Whatsapps</th>
                          <th className="p-2">NO’s</th>
                          <th className="p-2">Appointments</th>
                          <th className="p-2">Listings</th>
                        </tr>
                      </thead>
                      <tbody>
                        {data.map(r => (
                          <tr key={r.agent} className="border-b border-neutral-900/60 hover:bg-neutral-900/40">
                            <td className="p-2 text-left">
                              <span className="mr-2 inline-flex min-w-6 items-center justify-center rounded-full border border-neutral-700 bg-neutral-900 px-2 py-0.5 text-xs text-neutral-200">{r.rank}</span>
                              {r.agent}
                            </td>
                            <td className="p-2 text-right tabular-nums">{r.dials}</td>
                            <td className="p-2 text-right tabular-nums">{r.answered}</td>
                            <td className="p-2 text-right tabular-nums">{r.whatsapps}</td>
                            <td className="p-2 text-right tabular-nums">{r.nos}</td>
                            <td className="p-2 text-right tabular-nums font-semibold">{r.appointments}</td>
                            <td className="p-2 text-right tabular-nums font-semibold">{r.listings}</td>
                          </tr>
                        ))}
                        {!data.length && (
                          <tr><td className="p-4 text-center text-neutral-400" colSpan="7">No data yet.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>

                  <div className="mt-3 flex flex-wrap items-center gap-2">
                    <span className="text-xs text-neutral-400">Metric for chart:</span>
                    {metricDefs.map(m => (
                      <button key={m.key} onClick={()=>setSelectedMetric(m.key)} className={"rounded-lg border px-2 py-1 text-xs " + (selectedMetric===m.key ? "border-red
